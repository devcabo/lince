<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lince</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f2937'/%3E%3Cpath d='M6 27 7 13 5 3l7 6q4-1 8 0l7-6-2 10 1 14q-10 4-20 0z' fill='%23d4a373'/%3E%3Cpath d='M5 3v-2M27 3v-2' stroke='%23d4a373' stroke-width='1.5' stroke-linecap='round'/%3E%3Cellipse cx='12' cy='17' rx='1.6' ry='2.2' fill='%231f2937'/%3E%3Cellipse cx='20' cy='17' rx='1.6' ry='2.2' fill='%231f2937'/%3E%3Cpath d='M14.5 22h3l-1.5 1.8z' fill='%231f2937'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/web/estilo.css">
</head>
<body>
<header>
  <b>Lince</b><span id="onde"></span><span class="esp"></span>
  <span id="modos"><button id="m_poligono" onclick="trocarModo('poligono')">Polígono</button><button id="m_bounding_box" onclick="trocarModo('bounding_box')">Bounding box</button></span><kbd title="Tecla T troca o modo">T</kbd><span id="sam"></span>
</header>
<main>
  <aside id="lotes"></aside>
  <section id="grade"><div id="filtros"></div><div id="miniaturas"></div></section>
  <section id="anotador" hidden>
    <div class="barra" id="barra"></div>
    <div id="palco"><canvas id="tela"></canvas><div id="aviso" hidden></div></div>
    <div class="dica" id="dica"></div>
  </section>
</main>
<dialog id="escolha">
  <form method="dialog">
    <b>Exportar para treino</b>
    <p>Lotes a exportar (cada um vira uma pasta no formato YOLO):</p>
    <label class="todos"><input type="checkbox" id="escolha_todos" checked> Todos</label>
    <div id="escolha_lotes"></div>
    <menu><button value="">Cancelar</button><button value="salvar" class="principal">Exportar</button></menu>
  </form>
</dialog>
<script src="/web/js/estado.js"></script>
<script src="/web/js/grade.js"></script>
<script src="/web/js/anotador.js"></script>
<script src="/web/js/entrada.js"></script>
</body>
</html>
